<div class="entreprise-vehicules">
  <table>
    <thead>
      <tr>
        <th>{{ 'entreprise.vehicules.immatriculation' | translate }}</th>
        <th>{{ 'entreprise.vehicules.statut' | translate }}</th>
        <th>{{ 'entreprise.vehicules.actions' | translate }}</th>
      </tr>
    </thead>
    <tr *ngFor="let vehicule of vehicules">
      <td>{{ vehicule.immatriculation }}</td>
      <td>{{ vehicule.statut }}</td>
      <td>
        <button type="button" (click)="basculerStatut(vehicule)">
          {{ (vehicule.statut === 'DISPONIBLE' ? 'entreprise.vehicules.mettreEnMaintenance' : 'entreprise.vehicules.remettreEnService') | translate }}
        </button>
        <button type="button" (click)="supprimer(vehicule)">{{ 'commun.action.supprimer' | translate }}</button>
      </td>
    </tr>
  </table>

  <h2>{{ 'entreprise.vehicules.ajouterUnVehicule' | translate }}</h2>
  <form [formGroup]="form" (ngSubmit)="ajouter()">
    <label>
      {{ 'entreprise.vehicules.typeDeVehicule' | translate }}
      <select formControlName="id_type_vehicule">
        <option [ngValue]="null" disabled>{{ 'entreprise.vehicules.selectionnerUnType' | translate }}</option>
        <option *ngFor="let type of typesVehicule" [ngValue]="type.id">{{ type.nom }}</option>
      </select>
    </label>
    <label>
      {{ 'entreprise.vehicules.immatriculation' | translate }}
      <input type="text" formControlName="immatriculation" />
    </label>
    <button type="submit" [disabled]="form.invalid">{{ 'entreprise.vehicules.ajouter' | translate }}</button>
  </form>
</div>
