<div class="notifications">
  <p>
    <button type="button" *ngIf="nombreNonLues" (click)="toutMarquerLu()">Tout marquer comme lu</button>
  </p>
  <table>
    <thead>
      <tr>
        <th>Message</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tr *ngFor="let notification of notifications" [class.notification-non-lue]="!notification.lu">
      <td>{{ notification.message }}</td>
      <td>{{ notification.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
      <td>
        <button type="button" *ngIf="!notification.lu" (click)="marquerLue(notification)">Marquer comme lue</button>
      </td>
    </tr>
  </table>
  <p *ngIf="!notifications.length">Aucune notification pour le moment.</p>
</div>
