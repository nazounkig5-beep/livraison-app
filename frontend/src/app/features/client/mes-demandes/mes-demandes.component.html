<div class="mes-demandes">

  <p><a routerLink="/client/creer-demande">Nouvelle demande</a></p>
  <table>
    <thead>
      <tr>
        <th>N°</th>
        <th>Trajet</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tr *ngFor="let demande of demandes">
      <td>#{{ demande.id }}</td>
      <td>{{ demande.adresse_depart }} → {{ demande.adresse_arrivee }}</td>
      <td>{{ demande.statut }}</td>
      <td>
        <a [routerLink]="['/client/mes-demandes', demande.id]">Détail</a>
        <button type="button" *ngIf="demande.statut === 'EN_ATTENTE'" (click)="annuler(demande)">Annuler</button>
      </td>
    </tr>
  </table>
  <p *ngIf="!demandes.length">Aucune demande pour le moment.</p>
</div>
