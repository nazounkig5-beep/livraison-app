<div class="incidents">
  <table>
    <thead>
      <tr>
        <th>Demande</th>
        <th>Description</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tr *ngFor="let incident of incidents">
      <td>
        #{{ incident.id_demande }}
        <ng-container *ngIf="incident.demande as demande"> — {{ demande.adresse_depart }} → {{ demande.adresse_arrivee }}</ng-container>
      </td>
      <td>{{ incident.description }}</td>
      <td>{{ incident.statut }}</td>
      <td>
        <button type="button" *ngIf="auth.aLeRole('ADMIN') && incident.statut === 'OUVERT'" (click)="resoudre(incident)">
          Marquer résolu
        </button>
      </td>
    </tr>
  </table>
  <p *ngIf="!incidents.length">Aucun incident.</p>

  <h2 *ngIf="!auth.aLeRole('ADMIN')">Signaler un incident</h2>
  <form *ngIf="!auth.aLeRole('ADMIN')" [formGroup]="form" (ngSubmit)="signaler()">
    <label>
      Demande concernée
      <select formControlName="id_demande">
        <option [ngValue]="null" disabled>Sélectionner une demande</option>
        <option *ngFor="let demande of mesDemandes" [ngValue]="demande.id">
          #{{ demande.id }} — {{ demande.adresse_depart }} → {{ demande.adresse_arrivee }}
        </option>
      </select>
    </label>
    <label>
      Description
      <input type="text" formControlName="description" />
    </label>
    <button type="submit" [disabled]="form.invalid">Signaler</button>
  </form>
</div>
