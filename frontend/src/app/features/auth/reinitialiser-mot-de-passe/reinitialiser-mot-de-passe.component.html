<div class="auth-page">
  <div class="auth-formulaire" style="width: 100%;">
    <div class="auth-carte">
      <h2>Choisir un nouveau mot de passe</h2>

      <div *ngIf="succes; else formulaire">
        <p class="succes">Mot de passe réinitialisé avec succès. Redirection vers la connexion…</p>
      </div>

      <ng-template #formulaire>
        <form [formGroup]="form" (ngSubmit)="soumettre()">
          <label>
            Nouveau mot de passe
            <input type="password" formControlName="mot_de_passe" />
          </label>
          <label>
            Confirmer le mot de passe
            <input type="password" formControlName="mot_de_passe_confirmation" />
          </label>
          <p class="erreur" *ngIf="erreur">{{ erreur }}</p>
          <button type="submit" [disabled]="form.invalid || envoiEnCours">
            {{ envoiEnCours ? 'Enregistrement…' : 'Réinitialiser le mot de passe' }}
          </button>
        </form>
        <p><a routerLink="/auth/login">← Retour à la connexion</a></p>
      </ng-template>
    </div>
  </div>
</div>
