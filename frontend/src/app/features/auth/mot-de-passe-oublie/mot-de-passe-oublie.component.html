<div class="auth-page">
  <div class="auth-formulaire" style="width: 100%;">
    <div class="auth-carte">
      <h2>{{ 'auth.motDePasseOublie.titre' | translate }}</h2>
      <p class="info-discrete">
        {{ 'auth.motDePasseOublie.description' | translate }}
      </p>

      <form [formGroup]="form" (ngSubmit)="soumettre()">
        <label>
          {{ 'auth.motDePasseOublie.email' | translate }}
          <input type="email" formControlName="email" placeholder="votre@email.com" />
        </label>
        <p class="succes" *ngIf="messageEnvoye">{{ 'auth.motDePasseOublie.confirmationEnvoyee' | translate }}</p>
        <p class="erreur" *ngIf="erreur">{{ erreur | translate }}</p>
        <button type="submit" [disabled]="form.invalid || envoiEnCours">
          {{ (envoiEnCours ? 'auth.motDePasseOublie.boutonEnCours' : 'auth.motDePasseOublie.bouton') | translate }}
        </button>
      </form>

      <p><a routerLink="/auth/login">{{ 'auth.motDePasseOublie.retour' | translate }}</a></p>
    </div>
  </div>
</div>
