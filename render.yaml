# Blueprint Render (optionnel) : sur render.com, "New +" -> "Blueprint" -> sélectionner ce repo
# détecte ce fichier et propose de créer le service automatiquement. Les valeurs marquées
# "sync: false" doivent être saisies manuellement dans le tableau de bord Render après création
# (secrets Neon, APP_KEY, etc.) — jamais commitées ici.
services:
  - type: web
    name: livraison-app-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: UTC
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # Secrets et valeurs propres à votre déploiement — à saisir dans le tableau de bord Render :
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
